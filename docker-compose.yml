services:
  db:
    image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_DB: nanofaktura
      POSTGRES_USER: nanofaktura
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Nastav POSTGRES_PASSWORD v .env souboru}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nanofaktura"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      # Výchozí jen na localhost (před aplikaci patří reverzní proxy s HTTPS).
      # APP_BIND=0.0.0.0 ji zpřístupní v síti — jen v důvěryhodné LAN.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    environment:
      NANOFAKTURA_DB_DRIVER: postgres
      NANOFAKTURA_DB_DSN: >-
        host=db
        user=nanofaktura
        password=${POSTGRES_PASSWORD}
        dbname=nanofaktura
        sslmode=disable
      NANOFAKTURA_STATIC_DIR: /app/dist
      NANOFAKTURA_DATA_DIR: /data
      # Všechny další proměnné aplikace se předávají pod stejným (plným) názvem z .env / prostředí
      # Portaineru. Krátké názvy (PUBLIC_URL, SMTP_HOST …) fungují jen jako starší zkratky.
      NANOFAKTURA_PUBLIC_URL: ${NANOFAKTURA_PUBLIC_URL:-${PUBLIC_URL:-http://localhost:8080}}
      NANOFAKTURA_SECRET_KEY: ${NANOFAKTURA_SECRET_KEY:-${SECRET_KEY:-}}
      NANOFAKTURA_SETUP_TOKEN: ${NANOFAKTURA_SETUP_TOKEN:-${SETUP_TOKEN:-}}
      NANOFAKTURA_ADMIN_EMAILS: ${NANOFAKTURA_ADMIN_EMAILS:-}
      NANOFAKTURA_ALLOW_SIGNUP: ${NANOFAKTURA_ALLOW_SIGNUP:-}
      NANOFAKTURA_SECURE_COOKIES: ${NANOFAKTURA_SECURE_COOKIES:-}
      NANOFAKTURA_TRUSTED_PROXIES: ${NANOFAKTURA_TRUSTED_PROXIES:-${TRUSTED_PROXIES:-}}
      NANOFAKTURA_SMTP_HOST: ${NANOFAKTURA_SMTP_HOST:-${SMTP_HOST:-}}
      NANOFAKTURA_SMTP_PORT: ${NANOFAKTURA_SMTP_PORT:-${SMTP_PORT:-587}}
      NANOFAKTURA_SMTP_TLS: ${NANOFAKTURA_SMTP_TLS:-${SMTP_TLS:-starttls}}
      NANOFAKTURA_SMTP_USER: ${NANOFAKTURA_SMTP_USER:-${SMTP_USER:-}}
      NANOFAKTURA_SMTP_PASSWORD: ${NANOFAKTURA_SMTP_PASSWORD:-${SMTP_PASSWORD:-}}
      NANOFAKTURA_MAIL_FROM: ${NANOFAKTURA_MAIL_FROM:-${MAIL_FROM:-}}
      NANOFAKTURA_DKIM_DOMAIN: ${NANOFAKTURA_DKIM_DOMAIN:-}
      NANOFAKTURA_DKIM_SELECTOR: ${NANOFAKTURA_DKIM_SELECTOR:-}
      NANOFAKTURA_DKIM_PRIVATE_KEY: ${NANOFAKTURA_DKIM_PRIVATE_KEY:-}
      NANOFAKTURA_DKIM_PRIVATE_KEY_FILE: ${NANOFAKTURA_DKIM_PRIVATE_KEY_FILE:-}
      NANOFAKTURA_DB_LOG: ${NANOFAKTURA_DB_LOG:-}
      NANOFAKTURA_DB_SLOW_MS: ${NANOFAKTURA_DB_SLOW_MS:-}
      NANOFAKTURA_IMPORT_MAX_MB: ${NANOFAKTURA_IMPORT_MAX_MB:-}
      NANOFAKTURA_DISABLE_RATE_LIMIT: ${NANOFAKTURA_DISABLE_RATE_LIMIT:-}
      NANOFAKTURA_DISABLE_API_DOCS: ${NANOFAKTURA_DISABLE_API_DOCS:-}
      NANOFAKTURA_WEBHOOKS_ALLOW_PRIVATE: ${NANOFAKTURA_WEBHOOKS_ALLOW_PRIVATE:-}
      NANOFAKTURA_WEBAUTHN_ORIGINS: ${NANOFAKTURA_WEBAUTHN_ORIGINS:-}
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
