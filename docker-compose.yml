services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nanofaktura
      POSTGRES_USER: nanofaktura
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Nastav POSTGRES_PASSWORD v .env souboru}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nanofaktura"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      NANOFAKTURA_DB_DRIVER: postgres
      NANOFAKTURA_DB_DSN: >-
        host=db
        user=nanofaktura
        password=${POSTGRES_PASSWORD}
        dbname=nanofaktura
        sslmode=disable
      NANOFAKTURA_STATIC_DIR: /app/dist
      NANOFAKTURA_PUBLIC_URL: ${PUBLIC_URL:-}
      # E-mail (prázdný SMTP_HOST = e-maily se jen vypisují do logu)
      NANOFAKTURA_SMTP_HOST: ${SMTP_HOST:-}
      NANOFAKTURA_SMTP_PORT: ${SMTP_PORT:-587}
      NANOFAKTURA_SMTP_TLS: ${SMTP_TLS:-starttls}
      NANOFAKTURA_SMTP_USER: ${SMTP_USER:-}
      NANOFAKTURA_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NANOFAKTURA_MAIL_FROM: ${MAIL_FROM:-}
      # Volitelné přepisy:
      # NANOFAKTURA_ALLOW_SIGNUP: "true"
      # NANOFAKTURA_SECURE_COOKIES: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
